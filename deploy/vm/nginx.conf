# Install to /etc/nginx/sites-available/crbs, symlink into sites-enabled,
# then run: sudo certbot --nginx -d crbs.example.org
#
# TLS is mandatory. With CRBS_ENV=production the session cookie is marked
# `secure`, so over plain http the browser drops it and sign-in fails silently.

server {
    listen 80;
    server_name crbs.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crbs.example.org;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/crbs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crbs.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/crbs/app/static/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Feeds the audit trail's ip_address column; without it every row logs 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
